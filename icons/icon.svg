  <path d="M47 31 v5 M32 39 h30 M39 39 c1 9 6 15 15 20 M55 39 c-2 9 -7 15 -16 20" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

